<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Best Travel Planning Website" />
        <meta name="keywords" content="Travlog, Travel Planner, Best Planner" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="stylesheet" href="/assets/icomoon/style.css" />
        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    </head>
    <body>
        <nav class="navbar">
            <span class="icon-logo navbar__logo"></span>
            <div id="navbar__cont" class="navbar__cont">
                <ul
                    id="navbar__ul"
                    aria-label="Navbar links"
                    class="navbar__ul"
                >
                    <li><a href="#" class="navbar__links"></a>Home</li>
                    <li><a href="#" class="navbar__links"></a>Discover</li>
                    <li><a href="#" class="navbar__links"></a>Special Deals</li>
                    <li><a href="#" class="navbar__links"></a>Contact</li>
                </ul>
                <div class="navbar__buttonsCont">
                    <button
                        type="button"
                        aria-label="Log In Button"
                        class="navbar__buttonsCont__login navbar__links"
                    >
                        Log In
                    </button>
                    <button
                        type="button"
                        aria-label="Sign Up Button"
                        class="navbar__buttonsCont__signup navbar__links"
                    >
                        Sign Up
                    </button>
                </div>
            </div>
            <div class="navbar__hamburgerCont">
                <button
                    type="button"
                    class="navbar__hamburger"
                    aria-label="Open hamburger menu"
                    aria-expanded="false"
                    aria-controls="navbar__ul navbar__cont"
                >
                    <span
                        class="icon-bars-solid navbar__hamburger__bars"
                    ></span>
                </button>
            </div>
        </nav>
        <script type="module" src="./src/script/index.js"></script>
        <noscript>JavaScript is not supported by your browser!</noscript>
    </body>
</html>
