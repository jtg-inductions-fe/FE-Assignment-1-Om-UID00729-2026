<!doctype html>
<html lang="en">
    <head>
        <title>Travlog - Book your Destination</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Best Travel Planning Website" />
        <meta name="keywords" content="Travlog, Travel Planner, Best Planner" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="stylesheet" href="/assets/icomoon/style.css" />
        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    </head>
    <body>
        <div class="container">
            <nav class="navbar">
                <a href="/" class="navbar__logo" title="Travlog"
                    ><span class="icon-logo"></span
                ></a>
                <div id="navbar__wrapper" class="navbar__wrapper">
                    <div
                        id="navbar__list"
                        aria-label="Navbar links"
                        class="navbar__list"
                    >
                        <a href="#" class="navbar__list-links navbar__focus-tab"
                            >Home</a
                        >
                        <a href="#" class="navbar__list-links navbar__focus-tab"
                            >Discover</a
                        >
                        <a href="#" class="navbar__list-links navbar__focus-tab"
                            >Special Deals</a
                        >
                        <a href="#" class="navbar__list-links navbar__focus-tab"
                            >Contact</a
                        >
                    </div>
                    <div class="navbar__buttons-wrapper">
                        <button
                            type="button"
                            aria-label="Log In Button"
                            class="button button--primary navbar__login navbar__focus-tab"
                        >
                            LogIn
                        </button>
                        <button
                            type="button"
                            aria-label="Sign Up Button"
                            class="button button--secondary navbar__signup navbar__focus-tab"
                        >
                            SignUp
                        </button>
                    </div>
                </div>
                <div class="navbar__hamburger-wrapper">
                    <button
                        type="button"
                        class="button button--icon navbar__hamburger-btn"
                        aria-label="Open hamburger menu"
                        aria-expanded="false"
                        aria-controls="navbar__list navbar__wrapper"
                        title="Open hamburger menu"
                    >
                        <span
                            class="icon-bars-solid navbar__hamburger-btn-bars"
                        ></span>
                    </button>
                </div>
            </nav>
            <main class="main">
                <section class="hero">
                    <div class="hero__ellipse"></div>
                    <div class="hero__gallery">
                        <div class="hero__gallery-bg">
                            <img
                                src="/assets/images/hero-earth-bg.webp"
                                alt="Airplanes flying across globe"
                            />
                        </div>
                        <div class="hero__gallery-group">
                            <div class="hero__gallery-group--left">
                                <div class="hero__gallery-left-image">
                                    <img
                                        src="/assets/images/hero-beach.webp"
                                        alt="Street leading to beach"
                                    />
                                </div>
                                <div class="hero__gallery-left-image">
                                    <img
                                        src="/assets/images/hero-mountain.webp"
                                        alt="Travel sitting on mountains"
                                    />
                                </div>
                            </div>
                            <div class="hero__gallery-group--right">
                                <div class="hero__gallery-right-image">
                                    <img
                                        src="/assets/images/hero-city.webp"
                                        alt="Traveler taking pictures on city street"
                                    />
                                </div>
                            </div>
                            <span
                                class="icon-telegram hero__gallery-telegram"
                            ></span>
                            <div class="hero__gallery-top-places">
                                <span class="icon-location"></span>
                                <span>Top Places</span>
                            </div>
                            <span
                                class="icon-add-user hero__gallery-add-user"
                            ></span>
                        </div>
                    </div>
                    <div class="hero__text-section">
                        <div class="hero__text-section-badge">
                            <h3 class="hero__text-section-badge-h3">
                                Explore the world!
                                <span
                                    class="icon-explore hero__text-section-badge-icon"
                                ></span>
                            </h3>
                        </div>
                        <h1 class="hero__text-section-heading">
                            Travel
                            <span class="hero__text-section-heading--span"
                                >top destination</span
                            >
                            of the world
                        </h1>
                        <p class="hero__text-section-para">
                            <span
                                >We always make our customer happy by
                                providing</span
                            >
                            <span>as many choices as possible</span>
                        </p>
                        <div class="hero__text-section-buttons">
                            <button
                                type="button"
                                class="button button--primary hero__text-section-buttons--get-started"
                            >
                                Get Started
                            </button>
                            <button
                                type="button"
                                class="button button--outline hero__text-section-buttons--watch-demo"
                            >
                                <span class="icon-video"></span>Watch Demo
                            </button>
                        </div>
                    </div>
                </section>
                <section class="partners">
                    <a
                        class="partners__links"
                        href="https://www.tripadvisor.in/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit Tripadvisor.in"
                        ><span
                            class="icon-tripadvisor partners__links-icons"
                        ></span
                    ></a>
                    <a
                        class="partners__link"
                        href="https://www.expedia.co.in/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit Expedia.co.in"
                        ><span class="icon-expedia partners__links-icons"></span
                    ></a>
                    <a
                        class="partners__link"
                        href="https://www.booking.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit Booking.com"
                        ><span class="icon-booking partners__links-icons"></span
                    ></a>
                    <a
                        class="partners__link"
                        href="https://www.airbnb.co.in/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit Airbnb.co.in"
                        ><span class="icon-airbnb partners__links-icons"></span
                    ></a>
                    <a
                        class="partners__link"
                        href="https://www.orbitz.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Visit Orbitz.com"
                        ><span class="icon-orbitz partners__links-icons"></span
                    ></a>
                </section>
            </main>
        </div>
        <script type="module" src="./src/script/index.js"></script>
        <noscript>JavaScript is not supported by your browser!</noscript>
    </body>
</html>
