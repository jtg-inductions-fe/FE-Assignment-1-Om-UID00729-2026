<!doctype html>
<html lang="en">
    <head>
        <title>Travlog - Book your Destination</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Best Travel Planning Website" />
        <meta name="keywords" content="Travlog, Travel Planner, Best Planner" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="stylesheet" href="/assets/icomoon/style.css" />
        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    </head>
    <body>
        <nav class="navbar">
            <a href="/" class="navbar__logo" title="Travlog"
                ><span class="icon-logo"></span
            ></a>
            <div id="navbar__wrapper" class="navbar__wrapper">
                <div
                    id="navbar__list"
                    aria-label="Navbar links"
                    class="navbar__list"
                >
                    <a href="#" class="navbar__list-links navbar__focus-tab"
                        >Home</a
                    >
                    <a href="#" class="navbar__list-links navbar__focus-tab"
                        >Discover</a
                    >
                    <a href="#" class="navbar__list-links navbar__focus-tab"
                        >Special Deals</a
                    >
                    <a href="#" class="navbar__list-links navbar__focus-tab"
                        >Contact</a
                    >
                </div>
                <div class="navbar__buttons-wrapper">
                    <button
                        type="button"
                        aria-label="Log In Button"
                        class="button button--primary navbar__login navbar__focus-tab"
                    >
                        LogIn
                    </button>
                    <button
                        type="button"
                        aria-label="Sign Up Button"
                        class="button button--secondary navbar__signup navbar__focus-tab"
                    >
                        SignUp
                    </button>
                </div>
            </div>
            <div class="navbar__hamburger-wrapper">
                <button
                    type="button"
                    class="button button--primary navbar__hamburger-btn"
                    aria-label="Open hamburger menu"
                    aria-expanded="false"
                    aria-controls="navbar__list navbar__wrapper"
                    title="Open hamburger menu"
                >
                    <span
                        class="icon-bars-solid navbar__hamburger-btn-bars"
                    ></span>
                </button>
            </div>
        </nav>
        <main>
            <section class="hero">
                <div class="hero__ellipse"></div>
                <div class="hero__imgSection">
                    <div class="hero__imgSection__bg">
                        <img src="/assets/images/hero-earth-bg.webp" alt="" />
                    </div>
                    <div class="imgSectionWrapper">
                        <div class="imgSectionWrapper__left">
                            <div class="imgSectionWrapper__left__img">
                                <img
                                    src="/assets/images/hero-beach.webp"
                                    alt="Hero Section Display Image: Beach"
                                />
                            </div>
                            <div class="imgSectionWrapper__left__img">
                                <img
                                    src="/assets/images/hero-mountain.webp"
                                    alt="Hero Section Display Image: Mountains"
                                />
                            </div>
                        </div>
                        <div class="imgSectionWrapper__right">
                            <div class="imgSectionWrapper__right__img">
                                <img
                                    src="/assets/images/hero-city.webp"
                                    alt="Hero Section Display Image: City"
                                />
                            </div>
                        </div>
                        <span
                            class="icon-telegram imgSectionWrapper__telegram"
                        ></span>
                        <span class="icon-location imgSectionWrapper__topPlaces"
                            >Top Places</span
                        >
                        <span
                            class="icon-add-user imgSectionWrapper__addUser"
                        ></span>
                    </div>
                </div>
                <div class="hero__textSection">
                    <div class="hero__textSection__h3">
                        <h3>
                            Explore the world!
                            <span class="icon-explore"></span>
                        </h3>
                    </div>
                    <h1 class="hero__textSection__h1">
                        Travel <span>top destination</span> of the world
                    </h1>
                    <p>
                        We always make our customer happy by providing as many
                        choices as possible
                    </p>
                    <div class="hero__textSection__buttons">
                        <button
                            type="button"
                            class="hero__textSection__buttons__getStarted"
                        >
                            Get Started
                        </button>
                        <button
                            type="button"
                            class="hero__textSection__buttons__watchDemo"
                        >
                            <span class="icon-video"></span>Watch Demo
                        </button>
                    </div>
                </div>
            </section>
            <section class="partners">
                <a
                    href="https://www.tripadvisor.in/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Tripadvisor.in"
                    ><span class="icon-tripadvisor partners__icons"></span
                ></a>
                <a
                    href="https://www.expedia.co.in/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Expedia.co.in"
                    ><span class="icon-expedia partners__icons"></span
                ></a>
                <a
                    href="https://www.booking.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Booking.com"
                    ><span class="icon-booking partners__icons"></span
                ></a>
                <a
                    href="https://www.airbnb.co.in/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Airbnb.co.in"
                    ><span class="icon-airbnb partners__icons"></span
                ></a>
                <a
                    href="https://www.orbitz.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Visit Orbitz.com"
                    ><span class="icon-orbitz partners__icons"></span
                ></a>
            </section>
        </main>
        <script type="module" src="./src/script/index.js"></script>
        <noscript>JavaScript is not supported by your browser!</noscript>
    </body>
</html>
